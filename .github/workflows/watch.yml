name: Blind Insurance Alerts

on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
    inputs:
      send_test:
        description: 'Send an iPhone test notification'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: blind-insurance-monitor
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check board and send alerts
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          SEND_TEST: ${{ github.event.inputs.send_test || 'false' }}
        run: python watch.py
      - name: Save notification history
        if: always()
        shell: bash
        run: |
          if [ -f state/seen.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add state/seen.json
            if ! git diff --cached --quiet; then
              git commit -m 'Update seen post identifiers'
              git push origin HEAD
            fi
          fi
